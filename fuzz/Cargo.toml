[package]
name = "musl-compat-test-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
libc = "=0.2.191"

[[bin]]
name = "kernel_version"
path = "fuzz_targets/kernel_version.rs"
test = false
doc = false
bench = false

# Separate development-only graph; no change to the product manifest/lockfile.
[workspace]
members = ["."]
